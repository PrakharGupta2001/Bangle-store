# Netlify Configuration for Daya Variety Store Storefront

[build]
  # Build static export of the customer storefront directly
  command = "npm run build --workspace @daya/storefront"
  # Directory containing the static exported HTML/CSS/JS
  publish = "apps/storefront/out"

[build.environment]
  # Ensure Node 24 LTS is used
  NODE_VERSION = "24"

[[redirects]]
  # Redirect root to default English locale
  from = "/"
  to = "/en/"
  status = 302
  force = false
